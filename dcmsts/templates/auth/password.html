{% extends "base.html" %}{% block title %}Change password{% endblock %}
{% block content %}
<div class="card narrow"><h1>Change password</h1>
<form method="post" data-no-offline><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Current password <input type="password" name="current" required autocomplete="current-password"></label>
<label>New password (12+ characters, letters and digits) <input type="password" name="new" required minlength="12" autocomplete="new-password"></label>
<label>Confirm new password <input type="password" name="confirm" required autocomplete="new-password"></label>
<button class="primary">Change password</button></form></div>
{% endblock %}
