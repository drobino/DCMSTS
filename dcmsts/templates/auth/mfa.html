{% extends "base.html" %}{% block title %}Verify{% endblock %}
{% block content %}
<div class="card narrow"><h1>Two-factor verification</h1>
<form method="post" data-no-offline><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>6-digit code from your authenticator app <input name="code" inputmode="numeric" pattern="[0-9]{6}" required autocomplete="one-time-code" autofocus></label>
<button class="primary">Verify</button></form></div>
{% endblock %}
