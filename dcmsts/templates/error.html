{% extends "base.html" %}{% block title %}Error {{ code }}{% endblock %}
{% block content %}<div class="card narrow empty-state"><p class="eyebrow muted">Error {{ code }}</p><h1>{{ 'Access denied' if code == 403 else ('Page not found' if code == 404 else 'Something went wrong') }}</h1><p class="muted">{{ message }}</p><p><a class="button primary" href="{{ url_for('dashboard.index') }}">Back to dashboard</a></p></div>{% endblock %}
